name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    uses: sunpm/tauri-release-workflows/.github/workflows/tauri-release.yml@2bb624c06f6a1c03314658464bd8e91a72f75826
    with:
      publish: ${{ github.event_name == 'push' }}
      artifact-paths: |
        dist/CodexQuota-*
        dist/release-assets-*.json
      release-introduction-path: docs/release-notes.md
      updater-public-key: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
